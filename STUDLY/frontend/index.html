<!doctype html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>STUDLY — Your AI Study Buddy</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="login-bg">


  <main class="login-card">


    <!-- =========================
         LOGO
    ========================== -->

    <img
      src="assets/logo.png"
      alt="STUDLY Logo"
      class="logo-image"
    >


    <!-- =========================
         TITLE
    ========================== -->

    <h1>STUDLY</h1>

    <p>Your AI Study Buddy</p>


    <!-- =========================
         TOAST
    ========================== -->

    <div
      id="toast"
      class="toast"
    ></div>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <form id="loginForm">


      <!-- EMAIL -->

      <label>

        Email

        <input
          id="email"
          type="email"
          required
          placeholder="Email"
        >

      </label>


      <!-- PASSWORD -->

      <label>

        Password

        <input
          id="password"
          type="password"
          required
          placeholder="Password"
        >

      </label>


      <!-- =========================
           SHOW PASSWORD
      ========================== -->

      <label class="password-toggle">

        <input
          id="showPassword"
          type="checkbox"
        >

        <span>
          Show password
        </span>

      </label>


      <!-- =========================
           LOGIN BUTTON
      ========================== -->

      <button
        class="primary"
        type="submit"
      >
        เข้าสู่ระบบ
      </button>


    </form>


    <!-- =========================
         DEMO ACCOUNT
    ========================== -->

    <div class="demo-hint">

      <b>Demo Accounts</b>

      <br>

      Student:
      student@demo.ac.th
      /
      studentdemo

      <br>

      Teacher:
      teacher@demo.ac.th
      /
      teacherdemo

    </div>


  </main>


  <script src="js/app.js"></script>


</body>

</html>
