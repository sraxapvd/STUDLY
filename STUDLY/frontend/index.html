<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>STUDLY — Your AI Study Buddy</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body class="login-bg">

  <main class="login-card">

    <img
      src="assets/logo.png"
      alt="STUDLY Logo"
      class="logo-image"
    >

    <h1>STUDLY</h1>

    <p>Your AI Study Buddy</p>

    <div
      id="toast"
      class="toast"
    ></div>

    <form id="loginForm">

      <label>
        Email

        <input
          id="email"
          type="email"
          required
          placeholder="Email"
        >
      </label>

      <label>
        Password

        <input
          id="password"
          type="password"
          required
          placeholder="Password"
        >
      </label>

      <button
        class="primary"
        type="submit"
      >
        เข้าสู่ระบบ
      </button>

    </form>

    <div class="demo-hint">

      <b>Demo Accounts</b>

      <br>

      Student:
      student@demo.ac.th
      /
      studentdemo

      <br>

      Teacher:
      teacher@demo.ac.th
      /
      teacherdemo

    </div>

  </main>

  <script src="js/app.js"></script>

</body>

</html>
